services:
  app:
    build: .
    volumes:
      - .:/usr/src/app
    ports:
      - 5000:5000
    env_file:
      - ./.env
    command: poetry run flask run --host 0.0.0.0 --port 5000
    # command: tail -f /dev/null

  database:
    image: postgres:18.4-alpine
    volumes:
      - postgres_volume:/var/lib/postgresql
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=app
    ports:
      - 5432:5432

volumes:
  postgres_volume:

