[project]
name = "arctic-office-projects-api"
version = "0.6.11"
description = "API for exposing data about Arctic Office projects"
authors = [
    { name = "BAS Web & Apps team", email = "webapps@bas.ac.uk" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13.1,<2.0.0",
    "asn1crypto>=1.5.1,<2.0.0",
    "attrs>=23.2.0,<24.0.0",
    "blinker>=1.7.0,<2.0.0",
    "certifi>=2024.2.2,<2025.0.0",
    "cffi>=2.0.0",
    "chardet>=5.2.0,<6.0.0",
    "click>=8.1.7,<9.0.0",
    "cryptography==50.0.0",
    "entrypoints>=0.4,<1.0.0",
    "faker==30.0.0",
    "flask==3.1.3",
    "gitdb>=4.0.11,<5.0.0",
    "gitdb2>=4.0.2,<5.0.0",
    "gitpython>=3.1.43,<4.0.0",
    "idna>=3.6,<4.0.0",
    "importlib-metadata>=7.1.0,<8.0.0",
    "importlib-resources>=6.4.0,<7.0.0",
    "iso3166>=2.1.1,<3.0.0",
    "jsonschema>=4.21.1,<5.0.0",
    "mako>=1.3.2,<2.0.0",
    "marshmallow>=3.21.1,<4.0.0",
    "marshmallow-jsonapi>=0.24.0,<0.25.0",
    "mccabe>=0.7.0,<1.0.0",
    "pbr>=6.0.0,<7.0.0",
    "pkgutil-resolve-name>=1.3.10,<2.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "pycodestyle>=2.11.1,<3.0.0",
    "pycparser>=2.22,<3.0.0",
    "pyflakes>=3.2.0,<4.0.0",
    "pyrsistent>=0.20.0,<0.21.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "python-dotenv==1.2.2",
    "python-editor>=1.0.4,<2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "requests==2.33.0",
    "rfc3987>=1.3.8,<2.0.0",
    "sentry-sdk>=2.8.0,<3.0.0",
    "simplejson>=3.19.2,<4.0.0",
    "six>=1.16.0,<2.0.0",
    "smmap>=5.0.1,<6.0.0",
    "smmap2>=3.0.1,<4.0.0",
    "stevedore>=5.2.0,<6.0.0",
    "str2bool>=1.1,<2.0.0",
    "text-unidecode>=1.3,<2.0.0",
    "typing-extensions>=4.10.0,<5.0.0",
    "ulid-py>=1.1.0,<2.0.0",
    "unittest-xml-reporting>=3.2.0,<4.0.0",
    "urllib3==2.7.0",
    "flask-reverse-proxy-fix>=0.2.1,<0.3.0",
    "werkzeug==3.1.6",
    "flask-request-id-header>=0.1.1,<0.2.0",
    "flask-migrate>=4.0.7,<5.0.0",
    "sqlalchemy>=2.0.29,<3.0.0",
    "sqlalchemy-utils>=0.41.2,<0.42.0",
    "zipp>=3.19.2,<4.0.0",
    "flask-sqlalchemy>=3.1.1,<4.0.0",
    "jinja2==3.1.6",
    "msal>=1.32.3,<2.0.0",
    "pyjwt>=2.10.1,<3.0.0",
]

[dependency-groups]
dev = [
    "black>=24.8.0,<25.0.0",
    "flake8>=7.1.1,<8.0.0",
    "pytest-cov>=7.0.0",
    "bandit>=1.7.9,<2.0.0",
    "pytest>=8.3.3,<9.0.0",
]

[tool.coverage.run]
omit = [
    "arctic_office_projects_api/importers/gtr.py",
    "arctic_office_projects_api/seeding.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "arctic_office_projects_api",
    "migrations",
]
