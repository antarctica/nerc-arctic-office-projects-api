stages:
  - build
  - lint
  - test
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_CERT_PATH: /certs/client
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_VERIFY: 1
  POSTGRES_HOST_AUTH_METHOD: trust
  GITLAB_REGISTRY: docker-registry.data.bas.ac.uk
  POSTGRES_DB: app_test
  POSTGRES_USER: app
  POSTGRES_PASSWORD: "password"
  APP_NAME: arctic-office-projects-api
  SENTRY_ORG: antarctica
  SENTRY_PROJECT: arctic-office-projects-api
  SNYK_ORG: antarctica
  SNYK_PROJECT: arctic-office-projects-api

build:
  stage: build
  tags:
    - dnd
  services:
    - docker:dind
  image: docker:latest
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $GITLAB_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/arctic-office-projects-api:latest -f Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/arctic-office-projects-api:latest
  only:
    - master

image:
  name: $CI_REGISTRY_IMAGE/arctic-office-projects-api:latest

lint:
  stage: lint
  before_script:
    - uv sync --locked
  script:
    - uv run flake8 . --ignore=E501 --exclude migrations,faker,.venv
  only:
    - master

bandit-app:
  stage: lint
  before_script:
    - uv sync --locked
  script:
    - uv run bandit -r arctic_office_projects_api
  only:
    - master

test-app:
  stage: test
  services:
    - name: postgres:12.12-alpine
      alias: postgres
  variables:
    POSTGRES_DB: runner_db
    POSTGRES_USER: runner
    POSTGRES_PASSWORD: password
    POSTGRES_HOST_AUTH_METHOD: trust
  before_script:
    - export FLASK_APP=manage.py
    - export FLASK_ENV=development
    - export SQLALCHEMY_DATABASE_URI=postgresql://runner:password@postgres:5432/runner_db
    - apk add --no-cache postgresql-client
    - psql -h postgres -U runner -d runner_db -c "ALTER SYSTEM SET listen_addresses TO '*';"
    - psql -h postgres -U runner -d runner_db -c "SELECT pg_reload_conf();"
    - psql -h postgres -U runner -d runner_db < docker/init.sql
  script:
    - uv sync --locked
    - uv run flask db upgrade
    - uv run pytest tests
  only:
    - master

dependencies-app:
  stage: test
  before_script:
    - apk add --update nodejs npm
    - npm install snyk -g
  script:
    - uv export --locked --format requirements.txt --output-file requirements.txt
    - snyk test --file=requirements.txt
    - snyk monitor --file=requirements.txt --project-name="$SNYK_PROJECT" --org="$SNYK_ORG"
  only:
    - master

package:
  stage: deploy
  before_script:
    - uv sync --locked
    - sed -i "s/^version = .*/version = \"$CI_COMMIT_TAG\"/" pyproject.toml
  script:
    - uv build
    - uv publish --token $CI_JOB_TOKEN --publish-url $CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/packages/pypi
  only:
    - tags