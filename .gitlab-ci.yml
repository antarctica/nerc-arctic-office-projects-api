stages:
  - build
  - lint
  - test
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_CERT_PATH: /certs/client
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_VERIFY: 1
  APP_NAME: arctic-office-projects-api
  GITLAB_REGISTRY: docker-registry.data.bas.ac.uk
  # Testing database
  POSTGRES_DB: app_test
  POSTGRES_USER: app
  POSTGRES_PASSWORD: "password"
  POSTGRES_HOST_AUTH_METHOD: trust
  ## - Testing paths
  CATEGORIES_SCHEMA_FILE_PATH: /usr/src/app/arctic_office_projects_api/resources/categories-schema.json
  ORGANISATIONS_SCHEMA_FILE_PATH: /usr/src/app/arctic_office_projects_api/resources/organisations-schema.json

build:
  stage: build
  tags:
    - dnd
  services:
    - docker:dind
  image: docker:latest
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $GITLAB_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/arctic-office-projects-api:latest -f Dockerfile .
    - docker push $CI_REGISTRY_IMAGE/arctic-office-projects-api:latest
  only:
    - master

image:
  name: $CI_REGISTRY_IMAGE/arctic-office-projects-api:latest

lint:
  stage: lint
  before_script:
    - uv sync --locked
  script:
    - uv run flake8 . --ignore=E501 --exclude migrations,faker,.venv
  only:
    - master

bandit-app:
  stage: lint
  before_script:
    - uv sync --locked
  script:
    - uv run bandit -r arctic_office_projects_api
  only:
    - master

test-app:
  stage: test
  services:
    - name: postgres:12.12-alpine
      alias: postgres
  variables:
    POSTGRES_DB: runner_db
    POSTGRES_USER: runner
    POSTGRES_PASSWORD: password
    POSTGRES_HOST_AUTH_METHOD: trust
  before_script:
    - export FLASK_APP=manage.py
    - export FLASK_ENV=development
    - export SQLALCHEMY_DATABASE_URI=postgresql://runner:password@postgres:5432/runner_db
    - apk add --no-cache postgresql-client
    - psql -h postgres -U runner -d runner_db -c "ALTER SYSTEM SET listen_addresses TO '*';"
    - psql -h postgres -U runner -d runner_db -c "SELECT pg_reload_conf();"
    - psql -h postgres -U runner -d runner_db < docker/init.sql
  script:
    - uv sync --locked
    - uv run flask db upgrade
    - uv run pytest tests
  only:
    - master

dependencies-app:
  stage: test
  before_script:
    - apk add --no-cache osv-scanner
  script:
    - uv lock --check
    - osv-scanner scan source --lockfile=uv.lock
  only:
    - master

package:
  stage: deploy
  variables:
    UV_PUBLISH_USERNAME: gitlab-ci-token
    UV_PUBLISH_PASSWORD: $CI_JOB_TOKEN
  before_script:
    - sed -i "s/^version = .*/version = \"$CI_COMMIT_TAG\"/" pyproject.toml
  script:
    - uv build
    - uv publish --publish-url "$CI_SERVER_URL/api/v4/projects/$CI_PROJECT_ID/packages/pypi"
  only:
    - tags